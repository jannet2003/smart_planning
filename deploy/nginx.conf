# =============================================================
# SmartPlanning Radiologie — Configuration Nginx
# Reverse-proxy HTTP vers Uvicorn (127.0.0.1:8000)
# =============================================================
# Remplace '_' par ton nom de domaine ou ton IP publique VPS

server {
    listen 80;
    server_name _;   # <- Remplace par ton domaine ou IP, ex: smartplanning.mondomaine.fr

    # Taille max des uploads (ex. import CSV)
    client_max_body_size 10M;

    # Compression des réponses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Proxy vers l'API FastAPI / fichiers statiques servis par FastAPI
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Fichiers statiques avec cache navigateur (servis par FastAPI mais on peut aussi déléguer à Nginx)
    location ~* \.(css|js|ico|png|jpg|jpeg|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Logs
    access_log /var/log/nginx/smartplanning_access.log;
    error_log  /var/log/nginx/smartplanning_error.log;
}
